project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - data/README.md
    - data/preparation-summary.json
    - data/SHA256SUMS.txt
    - data/greater-sydney-sa2.gpkg
    - data/greater-sydney-sa2-display.geojson
    - data/sydney-sa2-population.csv
    - data/sydney-sa2-population-long.csv
    - data/sydney-public-schools.csv
    - data/sydney-population-grid-2025.tif


format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-fold: false
    highlight-style: github
    embed-resources: true
    lang: en-AU
    smooth-scroll: true
    link-external-newwindow: true
    fig-width: 9
    fig-height: 5

execute:
  echo: true
  warning: true
  message: false
  error: false
  cache: false
  freeze: false
